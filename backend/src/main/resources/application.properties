# =========================================
# Hotel Reservation System - Backend Config
# =========================================

# ---- Server ----
server.port=8080

# ---- MySQL Datasource ----
# Change username/password to match your local MySQL installation.
# NEVER commit a real production password to version control.
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_reservation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update will create/alter tables automatically based on entities.
# For a clean seed-data load, you can temporarily use "create" once, then switch back to "update".
spring.jpa.hibernate.ddl-auto=update
# SQL logging is OFF by default (it leaks data into logs). Turn it on locally
# with SPRING_JPA_SHOW_SQL=true when debugging.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Keep the Hibernate session open through view rendering (JSON serialization)
# so lazy fields like Hotel.rooms and Room.amenities don't throw
# LazyInitializationException when a controller returns an entity directly.
spring.jpa.open-in-view=true

# ---- Jackson ----
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Logging ----
logging.level.com.hotel.reservation=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

# ---- JWT ----
# Set JWT_SECRET (>= 32 random bytes, e.g. `openssl rand -base64 48`) in every
# real deployment. There is intentionally NO default value in this file: if
# JWT_SECRET is empty the app generates a random one at startup (fine for local
# dev, but every restart logs everybody out and multiple instances won't agree).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Seed / demo accounts (see DataInitializer + README "Demo accounts") ----
# Set APP_SEED_DEMO_ACCOUNTS=false in production. The admin account is always
# created; set APP_SEED_ADMIN_PASSWORD to choose its password. When these are
# left empty DataInitializer falls back to the demo passwords listed in README.
app.seed.demo-accounts=${APP_SEED_DEMO_ACCOUNTS:true}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.guest-password=${APP_SEED_GUEST_PASSWORD:}
app.seed.owner-password=${APP_SEED_OWNER_PASSWORD:}

# ---- Error responses ----
# Never put exception messages / stack traces / binding details in error bodies.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---- CORS ----
# Comma-separated origins allowed to call this API from a browser. Add your
# deployed frontend's URL here (or set the APP_CORS_ALLOWED_ORIGINS /
# app.cors.allowed-origins env var in your hosting platform) when deploying -
# e.g. https://your-app.vercel.app
app.cors.allowed-origins=http://localhost:3000

# ---- Image uploads (admin: hotel/room photos) ----
# Files are stored under ${app.upload.dir}/images and served at /uploads/images/**.
# In production point app.upload.dir at a persistent volume, and set
# app.upload.public-base-url to the public URL of this API (e.g. https://api.example.com).
# That URL is never taken from the request's Host header.
# Photos no hotel/room refers to any more are deleted nightly once older than the grace period.
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.public-base-url=${APP_UPLOAD_PUBLIC_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
app.upload.cleanup-enabled=${APP_UPLOAD_CLEANUP_ENABLED:true}
app.upload.cleanup-grace-hours=${APP_UPLOAD_CLEANUP_GRACE_HOURS:24}
