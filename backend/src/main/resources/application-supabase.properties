# =========================================================
# Spring profile "supabase": run the backend against a Supabase
# (PostgreSQL) database instead of local MySQL.
#
#   1. Run database/schema-supabase.sql once in Supabase -> SQL Editor.
#   2. Set these environment variables (never commit the password):
#        SUPABASE_DB_URL       jdbc:postgresql://<host>:5432/postgres?sslmode=verify-full&sslrootcert=/path/to/supabase-ca.crt
#                              (Supabase -> Project Settings -> Database -> SSL
#                              Configuration -> download the CA certificate.
#                              `sslmode=require` only ENCRYPTS the connection; it does
#                              not check who is on the other end, so a
#                              man-in-the-middle could read the traffic.
#                              `verify-full` checks the server's certificate and host
#                              name against the CA file.)
#        SUPABASE_DB_USER      postgres            (direct connection)
#                              postgres.<project-ref>   (pooler connection)
#        SUPABASE_DB_PASSWORD  your database password
#      Copy host/user from Supabase -> Project Settings -> Database ->
#      Connection string. Use the DIRECT connection or the SESSION pooler
#      (port 5432). Avoid the transaction pooler (port 6543): it does not
#      support the prepared statements Hibernate uses.
#   3. Start with:  SPRING_PROFILES_ACTIVE=supabase
#      (or: mvn spring-boot:run -Dspring-boot.run.profiles=supabase)
# =========================================================
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.hzvnlnecqzdlidzunnsk
spring.datasource.password=@07Gus12gus
spring.datasource.driver-class-name=org.postgresql.Driver

# The tables come from database/schema-supabase.sql - do not let Hibernate
# alter the schema.
spring.jpa.hibernate.ddl-auto=validate
# Override the MySQL dialect from application.properties.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
